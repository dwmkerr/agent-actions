name: Claude Code

on:
  workflow_call:
    inputs:
      trigger_phrase:
        description: "Phrase to trigger the agent"
        type: string
        default: "@claude"
      timeout_minutes:
        description: "Maximum runtime in minutes"
        type: number
        default: 30
      allowed_users:
        description: "Comma-separated list of GitHub usernames allowed to trigger (empty = anyone with repo access)"
        type: string
        default: "dwmkerr"
      bot_name:
        description: "GitHub username used for git commits (default: github-actions[bot])"
        type: string
        default: ""
      bot_id:
        description: "GitHub numeric user ID matching bot_name (default: 41898282, the github-actions[bot] ID)"
        type: string
        default: ""
    secrets:
      anthropic_api_key:
        required: true
      bot_token:
        description: "PAT for a custom bot identity. If unset, defaults to GITHUB_TOKEN (github-actions bot)"
        required: false

permissions:
  contents: write
  pull-requests: write
  issues: write
  actions: read
  id-token: write

concurrency:
  group: ${{ github.workflow }}-${{ github.event.issue.number || github.event.pull_request.number }}
  cancel-in-progress: false

jobs:
  claude:
    if: |
      (
        inputs.allowed_users == '' ||
        contains(inputs.allowed_users, github.event.sender.login)
      ) && (
        (github.event_name == 'issue_comment' && contains(github.event.comment.body, inputs.trigger_phrase)) ||
        (github.event_name == 'pull_request_review_comment' && contains(github.event.comment.body, inputs.trigger_phrase)) ||
        (github.event_name == 'pull_request_review' && contains(github.event.review.body, inputs.trigger_phrase)) ||
        (github.event_name == 'issues' && contains(github.event.issue.labels.*.name, 'claude')) ||
        (github.event_name == 'issues' && (contains(github.event.issue.body, inputs.trigger_phrase) || contains(github.event.issue.title, inputs.trigger_phrase)))
      )
    runs-on: ubuntu-latest
    timeout-minutes: ${{ inputs.timeout_minutes }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Run Claude Code
        uses: anthropics/claude-code-action@v1
        with:
          anthropic_api_key: ${{ secrets.anthropic_api_key }}
          trigger_phrase: ${{ inputs.trigger_phrase }}
          github_token: ${{ secrets.bot_token }}
          # Fall back to the github-actions[bot] identity when the caller
          # doesn't supply one. Empty strings get forwarded to the action
          # and override its own defaults, which makes `git config user.name ""`
          # fail at the configureGitAuth step. The `|| default` pattern means
          # an unset caller input resolves to the fallback instead of "".
          # 41898282 is the stable GitHub user ID for github-actions[bot];
          # it's hardcoded because GitHub App installation tokens can't
          # query the /user endpoint to resolve it at runtime (claude-code-action #534).
          bot_name: ${{ inputs.bot_name || 'github-actions[bot]' }}
          bot_id: ${{ inputs.bot_id || '41898282' }}
