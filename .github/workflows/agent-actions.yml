# This repo eats its own dogfood — uses the reusable workflow defined here.
name: Agent Actions

on:
  issue_comment:
    types: [created]
  pull_request_review_comment:
    types: [created]
  pull_request_review:
    types: [submitted]
  issues:
    types: [opened, edited, labeled]

jobs:
  claude:
    uses: dwmkerr/agent-actions/.github/workflows/claude.yml@main
    with:
      bot_name: "dwmkerr-agent"
      bot_id: "246517607"
    secrets:
      anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
      bot_token: ${{ secrets.DWMKERR_AGENT_TOKEN }}
